name: SafeHaven TAY App CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize Test Database Schema
      run: |
        # Set up a fresh testing database using the seed script
        if [ -f database/seed.py ]; then
          python database/seed.py
        fi

    - name: Validate Python Sources
      run: python -m compileall -q app.py database fccw_*.py tests

    - name: Check Installed Dependencies
      run: python -m pip check

    - name: Run Unit Tests
      run: |
        python -m unittest discover tests/
